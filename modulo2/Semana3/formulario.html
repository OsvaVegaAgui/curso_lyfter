<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link href="css/formulario.css" rel="stylesheet">

</head>
<body>

    <form class="formulario" action="https://dummyjson.com/test" method="POST">

        <div class="raya"></div>

        <h1>Contact us!</h1>
        <p>Got something to say? Fire away!</p>

        <input type="text" id="first_name" name="firstName" placeholder="First name*" required />
        <input type="text" id="last_name" name="lastName" placeholder="Last name*" required />
        <input type="email" id="email" name="email" placeholder="Email address*" required />

        <select name="type" id="type">
            <option hidden>What's your message about?*</option>
            <option value="question">Question</option>
            <option value="suggestion">Suggestion</option>
        </select>

        <textarea id="message" name="message" placeholder="Fire away!" required rows="2"></textarea>

        <input class="btn" type="submit" value="Send my message" />

        <div class="footer">
            <label>Power by</label> <img src="img/logo_form.jpg" width="85px">
        </div>
        
    </form>

</body>
</html>
