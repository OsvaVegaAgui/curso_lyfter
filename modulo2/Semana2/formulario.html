<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Votación</title>
</head>
<body>
    <header>
        <h1>Formulario de votación en línea Costa Rica 2026</h1>
    </header>

    <main>
        <form action="https://www.tse.go.cr/comunicado932.htm">

            <h2>Datos del votante:</h2>

            <label for="nombre">Nombre completo:</label><br>
            <input type="text" id="nombre" name="nombre"><br><br>

            <label for="correo">Correo:</label><br>
            <input type="email" id="correo" name="correo"><br><br>

            <label for="cedula">Cedula de identidad:</label><br>
            <input type="text" id="cedula" name="cedula"><br><br>

            <label for="telefono">Teléfono:</label><br>
            <input type="tel" id="telefono" name="telefono"><br><br>

            <h2>Seleccione su candidato:</h2>

            <input type="radio" id="candidato1" name="candidato" value="Candidato #1">
            <label for="candidato1">Candidato #1</label><br>

            <input type="radio" id="candidato2" name="candidato" value="Candidato #2">
            <label for="candidato2">Candidato #2</label><br>

            <input type="radio" id="candidato3" name="candidato" value="Candidato #3">
            <label for="candidato3">Candidato #3</label><br><br>

            <button type="submit">Votar</button>
        </form>
    </main>
    
    <footer>
        <p>Todos derechos reservados - 2025</p>
    </footer>
</body>
</html>
